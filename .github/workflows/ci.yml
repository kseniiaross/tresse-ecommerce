name: TRESSE CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tresse_backend

    env:
      DJANGO_SETTINGS_MODULE: tresse.settings_test
      SECRET_KEY: test-secret-key
      DEBUG: "True"
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: ""

      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"

      # Placeholder Stripe values so orders/views_stripe.py's webhook-secret
      # guard doesn't 500 before reaching the mocked stripe.* calls in tests.
      # Not real credentials — safe to keep in plain text.
      USE_STRIPE: "False"
      STRIPE_PUBLIC_KEY: pk_test_dummy
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_test_dummy

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest || test $? -eq 5

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tresse_frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tresse_frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint with Biome
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build